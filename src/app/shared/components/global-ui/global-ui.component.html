<!-- SPINNER DE CARGA GLOBAL -->
@if (uiService.isLoading$ | async) {
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center">
    <div class="bg-white p-5 rounded-2xl shadow-2xl flex flex-col items-center">
      <svg class="animate-spin h-10 w-10 text-blue-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="text-sm font-semibold text-slate-700">Procesando...</span>
    </div>
  </div>
}

<!-- CONTENEDOR DE TOASTS -->
<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 pointer-events-none">
  @for (toast of toasts; track $index) {
    <div class="pointer-events-auto flex items-center w-80 p-4 rounded-lg shadow-xl transition-all duration-300 translate-x-0 border-l-4"
         [ngClass]="toast.type === 'error' ? 'bg-white border-red-500 text-slate-800' : 'bg-white border-green-500 text-slate-800'">
      
      <!-- Icono Error -->
      @if (toast.type === 'error') {
        <svg class="w-6 h-6 text-red-500 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      }
      <!-- Icono Éxito -->
      @if (toast.type === 'success') {
        <svg class="w-6 h-6 text-green-500 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      }
      
      <p class="text-sm font-medium flex-1">{{ toast.message }}</p>
      
      <button (click)="removeToast($index)" class="text-gray-400 hover:text-gray-600 ml-3">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  }
</div>
