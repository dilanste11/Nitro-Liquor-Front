<div class="max-w-2xl mx-auto p-6">
  <div class="flex items-center gap-4 mb-8">
    <a routerLink="/admin/shipping-methods" class="text-gray-400 hover:text-gray-600 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    </a>
    <h1 class="text-2xl font-bold text-gray-800">
      {{ isEditMode ? 'Editar Método de Envío' : 'Nuevo Método de Envío' }}
    </h1>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sm:p-8">
    <form [formGroup]="shippingForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Método *</label>
        <input type="text" formControlName="name" placeholder="Ej. Envío Estándar, Recogida Local" 
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Costo de Envío (COP) *</label>
        <input type="number" formControlName="price" placeholder="0" 
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="flex items-center gap-3 bg-gray-50 p-4 rounded-lg border border-gray-200">
        <input type="checkbox" id="isActive" formControlName="isActive" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
        <label for="isActive" class="text-sm font-medium text-gray-700 cursor-pointer">Activar este método de envío</label>
      </div>

      <div class="pt-4 flex justify-end gap-3">
        <a routerLink="/admin/shipping-methods" class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium transition-colors">
          Cancelar
        </a>
        <button type="submit" [disabled]="shippingForm.invalid || isSaving"
                class="bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white px-8 py-2.5 rounded-lg font-medium shadow-sm transition-colors">
          {{ isSaving ? 'Guardando...' : 'Guardar Método' }}
        </button>
      </div>

    </form>
  </div>
</div>
