<div class="mb-6 flex items-center justify-between">
  <h1 class="text-2xl font-bold text-slate-800">{{ isEditMode ? 'Editar' : 'Nueva' }} Forma de Pago</h1>
  <a routerLink="/admin/payment-forms" class="text-gray-500 hover:text-gray-700 font-medium text-sm">Volver</a>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 max-w-xl">
  <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
      <input type="text" formControlName="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
      <input type="text" formControlName="description" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Visibilidad</label>
      <select formControlName="visibility" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
        <option value="PUBLIC">Público</option>
        <option value="INTERNAL">Interno</option>
      </select>
    </div>
    <div class="flex items-center">
      <input type="checkbox" formControlName="isActive" class="h-4 w-4 text-blue-600 rounded">
      <label class="ml-2 block text-sm text-gray-900">Activo</label>
    </div>
    <div class="pt-4 flex justify-end">
      <button type="submit" [disabled]="paymentForm.invalid || isLoading" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg disabled:bg-blue-300">
        {{ isLoading ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
