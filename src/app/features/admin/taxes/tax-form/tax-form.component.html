<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold text-slate-800">
      {{ isEditMode ? 'Editar Impuesto' : 'Nuevo Impuesto' }}
    </h1>
    <p class="text-slate-500">Configura los impuestos aplicables a los productos.</p>
  </div>
  <a routerLink="/admin/taxes" class="text-gray-500 hover:text-gray-700 font-medium text-sm flex items-center">
    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    Volver a la lista
  </a>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 max-w-xl">
  <form [formGroup]="taxForm" (ngSubmit)="onSubmit()" class="space-y-6">
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Impuesto</label>
      <input type="text" formControlName="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ej: IVA, Impoconsumo...">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Porcentaje (%)</label>
      <input type="number" formControlName="percentage" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ej: 19">
    </div>

    <div class="pt-4 flex justify-end">
      <button type="submit" [disabled]="taxForm.invalid || isLoading" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors disabled:bg-blue-300">
        {{ isLoading ? 'Guardando...' : (isEditMode ? 'Guardar Cambios' : 'Crear Impuesto') }}
      </button>
    </div>

  </form>
</div>
