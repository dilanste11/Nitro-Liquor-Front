<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold text-slate-800">
      {{ isProfileMode ? 'Mi Perfil' : (isEditMode ? 'Editar Usuario' : 'Nuevo Usuario') }}
    </h1>
    <p class="text-slate-500">
      {{ isProfileMode ? 'Actualiza tu información personal.' : 'Registra a un nuevo trabajador en el sistema.' }}
    </p>
  </div>
  
  <!-- Ocultamos o cambiamos el enlace de "Volver" si está en modo perfil -->
  @if (!isProfileMode) {
    <a routerLink="/admin/users" class="text-gray-500 hover:text-gray-700 font-medium text-sm flex items-center">
      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Volver a la lista
    </a>
  }
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 max-w-2xl">
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-6">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Documento de Identidad</label>
        <input type="text" formControlName="document" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input type="text" formControlName="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
        <input type="text" formControlName="lastName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de Usuario (Login)</label>
        <input type="text" formControlName="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ej: dilan.alzate">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
        <input type="email" formControlName="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
        <input type="text" formControlName="phoneNumber" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Nacimiento</label>
        <input type="date" formControlName="birthDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      @if (!isProfileMode) {
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Rol en el Sistema</label>
          <select formControlName="rolId" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white transition-all">
            <option [ngValue]="null" disabled>Selecciona un rol...</option>
            @for (role of roles; track role.id) {
              <option [value]="role.id">{{ role.code }}</option>
            }
          </select>
        </div>
      }

      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Contraseña {{ isEditMode ? '(Opcional)' : '' }}
        </label>
        <input type="password" formControlName="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" [placeholder]="isEditMode ? 'Dejar en blanco para no cambiar' : 'Mínimo 6 caracteres'">
      </div>
    </div>

    <div class="pt-4 flex justify-end">
      <button type="submit" [disabled]="userForm.invalid || isLoading" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors disabled:bg-blue-300">
        {{ isLoading ? 'Guardando...' : (isEditMode ? 'Guardar Cambios' : 'Crear Usuario') }}
      </button>
    </div>

  </form>
</div>
