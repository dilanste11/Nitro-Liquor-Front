<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold text-slate-800">
      {{ isEditMode ? 'Editar Proveedor' : 'Nuevo Proveedor' }}
    </h1>
    <p class="text-slate-500">Completa la información del proveedor.</p>
  </div>
  <a routerLink="/admin/providers" class="text-gray-500 hover:text-gray-700 font-medium text-sm flex items-center">
    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    Volver a la lista
  </a>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 max-w-2xl">
  <form [formGroup]="providerForm" (ngSubmit)="onSubmit()" class="space-y-6">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Documento / NIT</label>
        <input type="text" formControlName="nit" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ej: 900123456-7">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre / Razón Social</label>
        <input type="text" formControlName="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ej: Distribuidora del Norte">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico (Opcional)</label>
        <input type="email" formControlName="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="contacto@proveedor.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono (Opcional)</label>
        <input type="text" formControlName="phone1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ej: 3001234567">
      </div>
    </div>

    <div class="pt-4 flex justify-end">
      <button type="submit" [disabled]="providerForm.invalid || isLoading" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors disabled:bg-blue-300">
        {{ isLoading ? 'Guardando...' : (isEditMode ? 'Guardar Cambios' : 'Crear Proveedor') }}
      </button>
    </div>

  </form>
</div>
