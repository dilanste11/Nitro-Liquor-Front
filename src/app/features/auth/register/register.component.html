<div class="min-h-[calc(100vh-12rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-2xl w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
    
    <div class="text-center">
      <h2 class="text-3xl font-black text-slate-900 tracking-tight">Crear Cuenta</h2>
      <p class="mt-2 text-sm text-gray-500">Únete a Nitro Liquor y recibe tus licores en casa.</p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <!-- Usamos un Grid de 2 columnas -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Documento -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Documento *</label>
          <input type="text" formControlName="document" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Nombre de Usuario -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de Usuario *</label>
          <input type="text" formControlName="username" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Nombres -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombres *</label>
          <input type="text" formControlName="name" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Apellidos -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos *</label>
          <input type="text" formControlName="lastName" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Correo Electrónico -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico *</label>
          <input type="email" formControlName="email" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Teléfono -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono Móvil *</label>
          <input type="text" formControlName="phoneNumber" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Contraseña -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña *</label>
          <input type="password" formControlName="password" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Confirmar Contraseña -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña *</label>
          <input type="password" formControlName="confirmPassword" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <!-- Errores generales de contraseña -->
      @if (registerForm.get('confirmPassword')?.touched && registerForm.hasError('mismatch')) {
        <div class="text-sm text-red-500 text-center">Las contraseñas no coinciden</div>
      }

      <button type="submit" [disabled]="registerForm.invalid || isLoading"
              class="w-full bg-slate-900 hover:bg-slate-800 disabled:bg-slate-300 text-white font-bold py-3 rounded-lg shadow-md transition-all">
        {{ isLoading ? 'Procesando...' : 'Registrarme' }}
      </button>

    </form>

    <div class="text-center mt-6">
      <p class="text-sm text-gray-600">
        ¿Ya tienes una cuenta? <a routerLink="/login" class="font-bold text-blue-600 hover:text-blue-500">Inicia Sesión</a>
      </p>
    </div>

  </div>
</div>
