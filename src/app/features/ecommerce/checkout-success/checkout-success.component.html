<div class="min-h-[70vh] flex items-center justify-center p-4">
  <div class="max-w-lg w-full bg-slate-900 rounded-3xl p-8 md:p-12 text-center shadow-2xl border border-slate-800">
    
    <!-- Ícono de Éxito Animado -->
    <div class="w-24 h-24 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>

    <!-- Título y Mensaje -->
    <h1 class="text-3xl font-black text-white mb-4">¡Pedido Confirmado!</h1>
    <p class="text-gray-400 mb-6 text-lg">
      Tu compra ha sido procesada correctamente. Estamos preparando todo para que disfrutes.
    </p>

    <!-- Tarjeta con el Número de Orden -->
    <div class="bg-slate-800 rounded-xl p-4 mb-8 border border-slate-700">
      <p class="text-sm text-gray-400 uppercase tracking-wider mb-1">Número de Seguimiento interno</p>
      <p class="text-2xl font-bold text-blue-400">#{{ orderId }}</p>
    </div>

    <!-- Botones de Acción -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <!-- Este botón llevará a "Mis Pedidos" (lo programamos a continuación) -->
      <a routerLink="/profile/orders" 
         class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-medium transition-colors border border-slate-700 w-full sm:w-auto">
        Ver mis pedidos
      </a>
      
      <!-- Botón para regresar a la tienda -->
      <a routerLink="/" 
         class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium shadow-lg transition-colors w-full sm:w-auto">
        Seguir comprando
      </a>
    </div>

  </div>
</div>
